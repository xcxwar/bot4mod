services:
  - type: web
    name: bale-four-bots
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python render_app.py
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GPT_BOT_TOKEN
        sync: false
      - key: BALE_TOKEN
        sync: false
      - key: BALE_BOT_TOKEN
        sync: false
      - key: GAPGPT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OWEN_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
